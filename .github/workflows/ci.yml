name: HelpDesk CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: helpdesk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python · hygiene, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate public distribution
        run: python scripts/validate_public_release.py

      - name: Validate Markdown links
        run: python scripts/check_markdown_links.py

      - name: Validate npm lock metadata
        run: python scripts/check_npm_lock.py

      - name: Check installed Python dependencies
        run: python -m pip check

      - name: Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q app.py ia.py security_utils.py tests scripts

      - name: Pytest
        env:
          APP_ENV: testing
          FLASK_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
          CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key
          ENABLE_DEMO_AUTH: "true"
          SOCKETIO_ASYNC_MODE: threading
        run: python -m pytest -q

  electron:
    name: Electron · syntax and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hd_electron

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hd_electron/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Inspect package manifest
        run: npm pkg get name version scripts.check

      - name: Run syntax and security checks
        run: npm run check

      - name: Check browser JavaScript syntax
        working-directory: .
        run: |
          node --check static/estoque.js
          node --check static/it_control.js
